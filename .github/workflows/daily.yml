name: Daily Video Upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            /usr/bin/ffmpeg
            /usr/bin/ffprobe
            /usr/lib/x86_64-linux-gnu/libav*
            /usr/lib/x86_64-linux-gnu/libsw*
            /usr/lib/x86_64-linux-gnu/libpostproc*
          key: ffmpeg-${{ runner.os }}-v2

      - name: Install FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache Whisper model
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-${{ hashFiles('config.yaml') }}
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node.js (For Vanta Remotion)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vanta dependencies
        working-directory: ./vanta
        run: npm ci || npm install

      - name: Decode YouTube credentials
        run: |
          if [ -n "${{ secrets.CLIENT_SECRET_B64 }}" ]; then echo "${{ secrets.CLIENT_SECRET_B64 }}" | base64 -d > client_secret.json || true; fi
          if [ -n "${{ secrets.TOKEN_B64 }}" ]; then echo "${{ secrets.TOKEN_B64 }}" | base64 -d > token_default.json || true; fi

      - name: Set TikTok Cookies
        if: env.TIKTOK_COOKIES != ''
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: echo "$TIKTOK_COOKIES" > tiktok_cookies.txt

      - name: Create .env file
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        run: |
          python - <<'PY'
          import os, json
          secrets = json.loads(os.environ.get('ALL_SECRETS','{}'))
          prefixes = ('GROQ_API_KEY', 'GEMINI_API_KEY', 'PEXELS_API_KEY', 'SAMBANOVA_API_KEY')
          explicit = {
              'ELEVENLABS_API_KEYS', 'CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN',
              'TOKEN_B64', 'CLIENT_SECRET_B64', 'PAT_TOKEN', 'PEXELS_API_KEY', 'SAMBANOVA_API_KEY'
          }
          with open('.env', 'w') as f:
              for k, v in secrets.items():
                  if any(k.startswith(p) for p in prefixes) or k in explicit:
                      v_escaped = v.replace('\n','\\n') if isinstance(v, str) else str(v)
                      f.write(f'{k}="{v_escaped}"\n')
          print('Wrote .env file')
          PY

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          LLM_PROVIDER: gemini
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
        run: |
          MAX_ATTEMPTS=2
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== Pipeline attempt $attempt/$MAX_ATTEMPTS ==="
            if python -m src.pipeline; then
              echo "Pipeline succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              WAIT=$((attempt * 30))
              echo "Pipeline failed. Waiting ${WAIT}s before retry..."
              sleep $WAIT
            fi
          done
          echo "All $MAX_ATTEMPTS attempts failed"
          exit 1

      - name: Upload pending videos
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          LLM_PROVIDER: gemini
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
        run: python -m src.upload_all

      - name: Commit state.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "state.json unchanged"
          else
            git commit -m "auto: update state.json"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-mp4
          path: output/**/final.mp4
          retention-days: 7
